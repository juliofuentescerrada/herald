name: Bootstrap

# scripts/bootstrap twice on a clean runner, when it or what it reads changes (agent-harness, harness-engineering).
on:
  pull_request:
    paths:
      - scripts/bootstrap
      - scripts/bootstrap.test.mjs
      - global.json
      - web/.nvmrc
      - web/package.json
      - Directory.Packages.props
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: node --test scripts/bootstrap.test.mjs
        env:
          HERALD_TEST_BOOTSTRAP: '1'

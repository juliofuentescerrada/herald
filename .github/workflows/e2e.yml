name: End-to-end

# The journeys run after a merge to main only (e2e-critical-paths); pull requests run CI.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      # Built here so the host's start in the suite stays within its readiness timeout.
      - run: dotnet build src/Herald.Host
      - run: pnpm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

name: CI

# Drafts run nothing (ci-path-filters D-3): CI runs when a pull request is opened ready, marked ready or updated.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's run. On main each merge has its own group and completes: the next merge's
# classification looks only at its own changes, so cancelling or queueing would drop a merge's checks (ci-path-filters D-2).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Classifies the change (ci-path-filters D-1, D-2): the code jobs run only when it touches code.
  changes:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$BEFORE"
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          fi
          node scripts/ci-changes.mjs "$base" HEAD >> "$GITHUB_OUTPUT"

  # Repository rules and spec traceability on every file (harness-engineering): the edit and commit hooks run
  # the same checks earlier, but can be bypassed; this job cannot.
  rules:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: dotnet restore Herald.slnx
      - name: Forbidden terms, spelling and licences
        run: node scripts/rules.mjs
      - name: Every specified scenario has a test, or is in the shrinking baseline
        run: node scripts/spec-coverage.mjs
      - name: Gitleaks, pinned and verified (private-data-guard D-2)
        run: scripts/gitleaks --install
      - name: No secret in the pull request's commits, or in the pushed ones
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A first push has no base, and a force push leaves one no ref reaches: scan the whole history (seconds) then.
          base="${RANGE%%..*}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then RANGE="${RANGE#*..}"; fi
          scripts/gitleaks git --log-opts="$RANGE" .
      - name: The rules' own tests
        run: node --test scripts/*.test.mjs

  # Each slice's executable test script against the local application with seeded data; its screenshots are the
  # pull request's `test-script-screens` artefact (harness-engineering D-14).
  test-scripts:
    needs: changes
    # Runs unless the classification ran and said documentation only: a failed classification runs the code jobs.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      # Built here so the servers start within their readiness timeout.
      - run: dotnet build src/Herald.Host && dotnet build tools/Herald.Seed
      - run: pnpm test:scripts
        working-directory: e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-script-screens
          path: e2e/test-results/screens
          if-no-files-found: ignore
          retention-days: 14

  dotnet:
    needs: changes
    # Runs unless the classification ran and said documentation only: a failed classification runs the code jobs.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Herald.slnx
      - run: dotnet format Herald.slnx --verify-no-changes --no-restore
      - run: dotnet build Herald.slnx -c Release --no-restore
      - name: Wolverine's generated code is current
        run: |
          dotnet run --project src/Herald.Host -c Release --no-build -- codegen delete
          dotnet run --project src/Herald.Host -c Release --no-build -- codegen write
          changes="$(git diff --name-status -- src/Herald.Host/Internal/Generated; git ls-files --others --exclude-standard -- src/Herald.Host/Internal/Generated)"
          if [ -n "$changes" ]; then
            echo "::error::Wolverine's generated code is stale; run 'dotnet run --project src/Herald.Host -- codegen write' and commit it."
            echo "$changes"
            exit 1
          fi
      - run: dotnet test --solution Herald.slnx -c Release --no-build

  web:
    needs: changes
    # Runs unless the classification ran and said documentation only: a failed classification runs the code jobs.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - name: The OpenAPI documents and generated clients are current
        run: |
          pnpm api:generate
          generated=(projects/api-client/openapi ':(glob)projects/api-client/src/**/generated/**')
          changes="$(git diff --name-status -- "${generated[@]}"; git ls-files --others --exclude-standard -- "${generated[@]}")"
          if [ -n "$changes" ]; then
            echo "::error::The OpenAPI documents or generated clients are stale; run 'pnpm api:generate' in web/ and commit them."
            echo "$changes"
            exit 1
          fi
      - run: pnpm lint
      - name: Boundary fixtures are reported exactly
        run: pnpm lint:boundaries
      - run: pnpm test:all
      - name: SSR isolation (concurrent requests, credentials stripped)
        run: pnpm test:ssr
      - run: pnpm build:all

schema: spec-driven

context: |
  Herald: runs tournaments (league, knockout, single match), game-agnostic; game-specific
  rules are policies. The maintainer's reference project for .NET and Azure.

  Stack: .NET 10, ASP.NET Core, Wolverine (in-process bus, outbox and inbox, Azure Service Bus
  transport), EF Core on PostgreSQL, .NET Aspire, Angular with TanStack Query, Azure Container
  Apps, Key Vault, Entra ID, OpenTofu, GitHub Actions.

  Conventions:
  - UI sharing (ADR 0011): an internal ui library from M0, consumed by both shells,
    separate from api-client; feature and app-local shared presentation remain in their app.
    ui supports SSR and has no app/API/query-cache/session/permission/routing dependencies.
    api-client owns no UI, navigation or business state. Add a
    component/state catalogue as development tooling with the first controls, not a third product app.
  - Frontend (ADR 0011): one Angular workspace, admin (CSR) and public/participant (hybrid)
    apps; SSG for corporate pages, SSR for dynamic public entry pages, CSR for personal
    workflows and live updates. Shared UI/tokens/API client, isolated SSR request state
    and public-only shared caches. Hosting includes an SSR runtime (ADR 0012).
  - Frontend features own related routes, UI, forms, queries/mutations and tests. Features do not
    import other features or the other app; app composition imports their explicit entry points.
    App platform owns session/organisation context and API configuration without feature imports.
    Enforce the import matrix in CI; define server/local-state ownership and invalidation on
    context changes. Feature boundaries do not require NgModules or one library per feature.
  - Everything in English. Keep one source per responsibility (ADR 0001): README for status,
    functional-discovery for rules/journeys/decisions, roadmap for delivery, ADRs for architecture,
    visual-direction for tokens and screen/state coverage. Design notes and measurements go in
    the change's design.md. Proposed ADRs may be refined; accepted decisions normally supersede.
    The maintainer authorised in-place pre-development consolidation on 2026-11-07; preserve
    confirmed/proposed/implemented distinctions. PPT, mockups and prototypes are explanatory
    supports, not production or independent rules. Apply Refactoring UI with square corners and
    the documented scale. The earlier round-management PNG is superseded for semantics.
  - openspec/specs describes what is implemented. Active deltas describe target changes;
    archived changes and dated reviews remain historical. m0-solution-skeleton, m0-messaging
    and m0-web-shell are done, as are the documentation consolidation and the static journey
    prototype, h1-organisation-access (ADR 0014, accepted) and e2e-critical-paths (ADR 0015).
    h1-tournament-setup (first F-02 slice: draft, configuration, review, publication, list) is
    implemented and awaits archival; registration, entries, competition and public reads do not exist.
  - Modular monolith: one module per bounded context, with Domain at the centre and vertical slices
    (Features: one namespace per use case, one file or cohesive folder; Persistence at the edge);
    features never depend on other features. Shared business rules belong in Domain; technical
    reuse belongs with its responsibility, not automatically in Domain. The set evolves with the design
    (today Organisations, Tournaments, Registration, Competition, Standings) and a change that
    moves a boundary explains it in its design.md; modules talk only through integration events
    in Herald.Contracts (ADR 0004). ModuleHosting is technical composition only; modules
    register through it inside the host's UseWolverine. Cross-module
    transitions identify an owner, authoritative conditions and reviewed revisions. Domain is
    independent of infrastructure; one schema per module for its state and no cross-schema joins;
    Wolverine's messages share one wolverine schema (Wolverine 6.62.0 cannot keep them per module).
  - Organisation, never "tenant", for the organising entity; British spelling (ADR 0003).
  - CQRS: commands through aggregates, returning identities/receipts/outcome or revision metadata
    and typed errors; queries as no-tracking projections (ADR 0005). An acknowledgement is not
    proof that a derived projection is current. Preserve operation identity on retries.
  - DDD: aggregates own the rules and raise domain events; integration events leave through
    the transactional outbox; consumers are idempotent; contract changes are backwards
    compatible or versioned (ADRs 0006, 0008).
  - Durable business history is owned by the relevant module (ADR 0007): preserve predecessor
    revisions, actor/time/reason and participation evidence with the effective state change.
    Logs and message retention are not the competitive audit trail. Only effective results score.
  - Tests read as sentences; use-case and API tests run against real PostgreSQL (ADR 0010).
  - Original work only: nothing taken from other codebases.
  - On every /opsx:propose, identify screens to create or modify and explicitly ask the user
    for mockups of each affected screen and its relevant states. Reuse supplied mockups
    when they cover the change and reference them in the change's design.md. Missing
    mockups keep the proposal pending visual input, not ready for implementation.
    For changes without screen impact, state that mockups are not applicable.

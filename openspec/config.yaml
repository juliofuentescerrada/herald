schema: spec-driven

context: |
  Herald: runs tournaments (league, knockout, single match), game-agnostic; game-specific
  rules are policies. The maintainer's reference project for .NET and Azure.

  Stack: .NET 10, ASP.NET Core, Wolverine (in-process bus, outbox and inbox, Azure Service Bus
  transport), EF Core on PostgreSQL, .NET Aspire, Angular with TanStack Query, Azure Container
  Apps, Key Vault, Entra ID, OpenTofu, GitHub Actions.

  The rules live in one place each; read the ones the change touches before writing an artifact:
  - CLAUDE.md: language, original work, game-agnostic core, licences, OpenSpec workflow.
  - src/CLAUDE.md: modules and vertical slices, CQRS, integration and fact events,
    notifications (ADR 0017 inventory), durable history. tests/CLAUDE.md: tests.
  - web/CLAUDE.md: UI sharing, rendering modes, feature boundaries and the import matrix.
  - herald-screens skill: screens, states, layout rules and mockups.
  - herald-docs skill: documentation sources, ADRs, decisions, archiving and status.
  - docs/herald-functional-discovery.md: product rules, journeys and the decision register (§15);
    read the sections the change needs, not the whole file.
  - docs/herald-h2-functional-discovery.md: detailed H2 extension; its decision statuses remain
    in the baseline register (D-30–38); target acceptance is not implemented behaviour.
  - docs/herald-h4-functional-discovery.md: detailed H4 Swiss/connected-consumer extension;
    D-48–56 remain proposed in the baseline register; no prerequisite milestone completion is implied.
  - docs/roadmap.md: delivery order, milestones and exit criteria; batches' progress is in GitHub
    Issues (ADR 0018). openspec/specs: implemented behaviour.

rules:
  proposal:
    - Name the decision-register rows the change depends on and their status; an undecided rule
      is an open question for the maintainer, never a decision taken in the proposal.
    - List every screen created or modified and its states, or state that mockups are not
      applicable (herald-screens skill).
    - List the notifiable facts the change introduces, or state that it introduces none (ADR 0017).
  design:
    - Reference the mockups or prototypes of each affected screen, as the herald-screens skill
      requires in a batch and outside one.
    - Explain any change to a module boundary, cross-module transition or integration contract,
      with its owner, authoritative conditions and revisions.
    - Measurements, visual comparisons and acceptance reviews are recorded here.
  tasks:
    - Include regenerating Wolverine's code and the OpenAPI client when handlers or endpoints change,
      a Playwright journey for each new user-visible flow, and the documentation updates the
      herald-docs skill requires on archive.
